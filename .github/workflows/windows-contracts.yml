name: Single SourceHead bootstrap diagnostic
on:
  push:
    branches: [dev/p0-com-selection-diagnostic]
    paths: [.github/workflows/windows-contracts.yml]
permissions:
  contents: read
jobs:
  source-head-only:
    if: github.repository == 'T1doo/KuaiYi' && github.ref == 'refs/heads/dev/p0-com-selection-diagnostic'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      CI: 'true'
    steps:
      - name: Checkout exact reviewed development commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
          ref: ${{ github.sha }}
          # Future delivery must be a single child of reviewed 4bc4ee3:
          # delivery -> 4bc4ee3 -> ae96589 -> locked 3ae6941.
          fetch-depth: 4
      - name: Observe one bounded SourceHead operation only
        timeout-minutes: 2
        shell: pwsh
        run: |
          & ./tests/scripts/run-source-head-windows-ci.ps1
          exit $LASTEXITCODE
