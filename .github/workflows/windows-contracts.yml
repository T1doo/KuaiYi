name: Single native reuse SDK compile only
on:
  push:
    branches: [dev/p0-com-selection-diagnostic]
    paths: [.github/workflows/windows-contracts.yml]
permissions:
  contents: read
jobs:
  native-sdk-build:
    if: github.repository == 'T1doo/KuaiYi' && github.ref == 'refs/heads/dev/p0-com-selection-diagnostic'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      CI: 'true'
    steps:
      - name: Checkout exact reviewed development commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
      - name: Configure and compile Release x64 only
        timeout-minutes: 8
        shell: pwsh
        run: |
          & ./tests/scripts/build-native-reuse.ps1
          exit $LASTEXITCODE
