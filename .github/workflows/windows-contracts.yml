name: Bounded SDK COM selection differential (six synthetic cases)
on:
  push:
    branches: [dev/p0-com-selection-diagnostic]
    paths: [.github/workflows/windows-contracts.yml]
permissions:
  contents: read
jobs:
  contracts:
    if: github.repository == 'T1doo/KuaiYi' && github.ref == 'refs/heads/dev/p0-com-selection-diagnostic'
    # First windows-2025 run resolved to VS2026; retain the reviewed VS2022 toolchain.
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      CI: 'true'
    steps:
      - name: Checkout reviewed development commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official tag checked 2026-10-12
        with:
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
      - name: Verify compiler evidence redaction
        shell: pwsh
        run: |
          & ./tests/scripts/sdk-compile-evidence.test.ps1
      - name: Verify selection summary contracts
        shell: pwsh
        run: |
          & ./tests/scripts/selection-ci-summary.test.ps1
      - name: Observe SDK COM selection once per browser and synthetic view
        shell: pwsh
        run: |
          & ./scripts/run-windows-selection-ci.ps1 -DiagnosticOnly -ComDiagnostic
          exit $LASTEXITCODE
