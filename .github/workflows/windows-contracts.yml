name: Windows native and public HWND contracts (not acceptance)
on:
  push:
    branches: [dev/p0-foundations]
    paths: [.github/workflows/windows-contracts.yml]
permissions:
  contents: read
jobs:
  contracts:
    if: github.repository == 'T1doo/KuaiYi' && github.ref == 'refs/heads/dev/p0-foundations'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      CI: 'true'
    steps:
      - name: Checkout reviewed development commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official tag checked 2026-10-12
        with:
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
      - name: Probe preinstalled tools, build native DLLs, run bounded public contracts
        shell: pwsh
        run: ./scripts/run-windows-ci.ps1
