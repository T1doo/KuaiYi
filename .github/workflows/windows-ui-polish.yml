name: Prepared whole WPF comparison (separate approval required)
run-name: Whole WPF comparison / ${{ github.sha }}
on:
  push:
    branches: [dev/ui-polish-visual-r03]
    paths: [.github/workflows/windows-ui-polish.yml]
permissions:
  contents: read
jobs:
  visual:
    if: ${{ github.repository == 'T1doo/KuaiYi' && github.event_name == 'push' && github.ref == 'refs/heads/dev/ui-polish-visual-r03' && github.event.repository.private == false && github.run_attempt == '1' }}
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CI: 'true'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_UI_LANGUAGE: en-US
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false
      - name: One original owned Job, locked build and complete WPF collection
        id: visual
        timeout-minutes: 13
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $code=2
          $returned=$false
          $nativeExit=$null
          $errorType=$null
          $claimed=$false
          $identity=[ordered]@{ GITHUB_SHA=$env:GITHUB_SHA; GITHUB_RUN_ID=$env:GITHUB_RUN_ID; GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT }
          $parent=Join-Path $env:GITHUB_WORKSPACE 'artifacts/ui-polish-visual-parent'
          $writeNew={ param($path,$value)
            $b=[System.Text.Encoding]::UTF8.GetBytes(($value | ConvertTo-Json -Depth 4 -Compress)+"`n")
            if($b.Length -gt 4096){throw [System.InvalidOperationException]::new('Parent receipt bound')}
            $stream=$null
            $failures=[System.Collections.Generic.List[System.Exception]]::new()
            try { $stream=[System.IO.File]::Open($path,[System.IO.FileMode]::CreateNew,[System.IO.FileAccess]::Write,[System.IO.FileShare]::None); $stream.Write($b,0,$b.Length); $stream.Flush($true) }
            catch { $failures.Add($_.Exception) }
            if($null -ne $stream){try { $stream.Dispose() } catch { $failures.Add($_.Exception) }}
            if($failures.Count -gt 0){throw [System.AggregateException]::new('Original parent receipt write or close unconfirmed',$failures)}
          }
          try {
            if($env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:GITHUB_RUN_ID -cnotmatch '^[1-9][0-9]{0,19}$' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw [System.InvalidOperationException]::new('Exact current identity required')}
            foreach($name in @('ui-polish-windows','ui-polish-publication','ui-polish-visual-parent','ui-polish-visual-parent-publication')){
              if(Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ('artifacts/'+$name))){throw [System.InvalidOperationException]::new('Original evidence namespace already exists')}
            }
            $ancestor=Join-Path $env:GITHUB_WORKSPACE 'artifacts'
            if((Test-Path -LiteralPath $ancestor) -and ((Get-Item -LiteralPath $ancestor -Force).Attributes -band [System.IO.FileAttributes]::ReparsePoint)){throw [System.InvalidOperationException]::new('Linked evidence ancestor')}
            New-Item -ItemType Directory -Path $parent -ErrorAction Stop | Out-Null
            $claim=[ordered]@{ Kind='OwnedVisualNamespaceClaim'; Identity=$identity; NativeAndPublicationRootsWereAbsent=$true }
            & $writeNew (Join-Path $parent 'namespace.json') $claim
            $claimed=$true
            'namespace=true' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
            & python -I -B ./scripts/windows_visual_job.py
            $nativeExit=$LASTEXITCODE
            $returned=$true
            $code=$nativeExit
          } catch { $code=2; $errorType=$_.Exception.GetType().Name }
          finally {
            if($claimed){
              $receipt=[ordered]@{ Kind='OriginalVisualParentReturn'; Identity=$identity; OriginalForegroundCommandReturned=$returned; NativeExitCode=$nativeExit; ErrorType=$errorType }
              try { & $writeNew (Join-Path $parent 'parent-exit.json') $receipt }
              catch { $code=2; Write-Output '{"Kind":"OriginalVisualParentReturn","Status":"ReceiptUnconfirmed"}' }
            }
          }
          exit $code
      - name: Verify only this run's already frozen evidence; never recollect native originals
        id: publication
        if: ${{ always() && steps.visual.outputs.namespace == 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          & python -I -B ./scripts/visual_publication.py --qualify
          exit $LASTEXITCODE
      - name: Preserve current owned parent receipts
        if: ${{ always() && steps.publication.outputs.parent == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whole-wpf-parent-${{ github.sha }}-attempt1
          path: artifacts/ui-polish-visual-parent-publication/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve immutable complete or UNKNOWN synthetic visual snapshot
        if: ${{ always() && steps.publication.outputs.visual == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whole-wpf-evidence-${{ github.sha }}-attempt1
          path: artifacts/ui-polish-publication/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
