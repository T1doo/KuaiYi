name: Prepared third fixed WPF UI comparison via registered entry
run-name: UI polish r03 before-after / ${{ github.sha }}
on:
  push:
    branches: [dev/ui-polish-visual-r03]
    paths: [.github/workflows/windows-ui-polish.yml]
permissions:
  contents: read
jobs:
  visual:
    if: ${{ github.repository == 'T1doo/KuaiYi' && github.event_name == 'push' && github.ref == 'refs/heads/dev/ui-polish-visual-r03' && github.event.repository.private == false && github.run_attempt == '1' }}
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CI: 'true'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_UI_LANGUAGE: en-US
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false
      - name: One owned validation subtree (prepare 8min / visual 6min)
        timeout-minutes: 14
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & python -I -B ./scripts/windows_visual_job.py
          $code=$LASTEXITCODE
          @{ OriginalForegroundCommandReturned=$true; SupervisorExitCode=$code; Scope='Own validation supervisor only, not runner/checkout/upload' } | ConvertTo-Json | Set-Content -LiteralPath artifacts/ui-polish-windows/parent-exit.json -Encoding utf8
          exit $code
      - name: Preserve complete success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-polish-${{ github.sha }}-attempt1
          # Direct original paths also survive a cancelled UNKNOWN owner before finally.
          path: |
            artifacts/ui-polish-windows/*.json
            artifacts/ui-polish-windows/*.log
            artifacts/ui-polish-windows/before-settings/
            artifacts/ui-polish-windows/before-overlay/
            artifacts/ui-polish-windows/after-settings/
            artifacts/ui-polish-windows/after-overlay/
            artifacts/ui-polish-windows/evidence/*-manifest.json
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: true
