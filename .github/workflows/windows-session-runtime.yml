name: One session runtime signature and managed validation attempt
on:
  push:
    branches: [dev/session-runtime-signature-windows]
    paths: [.github/workflows/windows-session-runtime.yml]
permissions:
  contents: read
jobs:
  signature-then-managed:
    if: ${{ github.repository == 'T1doo/KuaiYi' && github.event_name == 'push' && github.ref == 'refs/heads/dev/session-runtime-signature-windows' && github.event.repository.private == false && github.run_attempt == '1' }}
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CI: 'true'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_UI_LANGUAGE: en-US
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact reviewed event and parent
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false
      - name: Resolve preinstalled verifier payload, verify signatures and use safe SDK only
        timeout-minutes: 14
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          & $python -I -B ./scripts/verify-session-runtime-windows.py
          exit $LASTEXITCODE
