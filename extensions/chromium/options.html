<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>快译扩展</title>
<body><h1>快译</h1><p id="status">连接状态：请查看扩展按钮提示。点击按钮可停止当前操作。</p>
<p>扩展仅在您右键选择图片后连接桌面。桌面未启用、未安装或宿主未授权时，会拒绝图片读取。浏览器扩展与桌面程序分别安装。</p>
<p>权限：图片菜单、本机消息、当前页面临时访问及目标图片定位；没有永久网站权限、Cookie 或浏览历史权限。</p>
<p>当前 P0 构建只传 PNG 原图或经验证的可见部分。跨源 frame、多个同 URL 目标、受限页面或坐标变化时，请使用桌面设置中的区域截图快捷键。</p>
<p>这里不保存 API Key，不修改浏览器安全设置。</p><script src="options.js"></script></body></html>
